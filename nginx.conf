server {
  listen 8000;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
  gzip_min_length 256;

  # Long-cache hashed assets
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|webp|woff2?|ico)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }

  # The two landing pages a post links to as evidence. They are machine output
  # kept exactly as generated, invented statistics and a fabricated testimonial
  # included, so they must never be indexed and read as something fberrez.co is
  # claiming. The directive lives here rather than in a <meta> tag precisely so
  # the files stay byte-identical to what was generated.
  #
  # ^~ so the asset regex above does not take the images out of this block.
  location ^~ /writing/claude-landing-pages/ {
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri $uri/index.html =404;
  }

  # Don't cache HTML
  location / {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri $uri.html $uri/index.html =404;
  }

  # Friendly 404 falls back to index for SPA-ish behavior; here we want a real 404 page,
  # but we don't ship one yet, so just return the default.
  error_page 404 /404.html;
  location = /404.html { internal; }
}
