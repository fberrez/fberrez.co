server {
  listen 8000;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  server_tokens off;

  # Redirects go out as a path, not as a full URL. nginx would otherwise build
  # one from its own listening port and send visitors to :8000, which does not
  # exist from outside the container.
  absolute_redirect off;

  gzip on;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
  gzip_min_length 256;

  # Long-cache hashed assets
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|webp|woff2?|ico)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }

  # Don't cache HTML
  location / {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri $uri.html $uri/index.html =404;
  }

  # Serve the custom page while preserving the 404 status.
  error_page 404 /404.html;
  location = /404.html { internal; }
}
