name: Deploy to VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Create deployment directory if it doesn't exist
            mkdir -p ~/portfolio
            
            # Create docker-compose.yml file directly on the server
            cat > ~/portfolio/docker-compose.yml << 'EOL'
            services:
              portfolio:
                image: ghcr.io/${{ github.repository }}:latest
                labels:
                  - "traefik.enable=true"
                  - "traefik.http.routers.portfolio.rule=Host(`www.fberrez.co`)"
                  - "traefik.http.routers.portfolio.entrypoints=websecure"
                  - "traefik.http.routers.portfolio.tls.certresolver=myresolver"
                  - "traefik.http.services.portfolio.loadbalancer.server.port=8000"
                environment:
                  - NODE_ENV=production
                  - PORT=8000
                  - NEXT_TELEMETRY_DISABLED=1
                restart: unless-stopped
                healthcheck:
                  test: ["CMD", "curl", "-f", "http://localhost:8000"]
                  interval: 30s
                  timeout: 5s
                  retries: 3
                  start_period: 15s
                networks:
                  - web

            networks:
              web:
                external: true
            EOL
            
            # Login to GitHub Container Registry
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull the latest image
            cd ~/portfolio
            docker compose pull
            
            # Deploy with zero downtime
            docker compose up -d --force-recreate
            
            # Clean up old images
            docker image prune -af 